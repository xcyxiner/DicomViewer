name: Continuous Integration

on:
  push:
    branches:
    - master
    tags:
    - 'v*'     # 打 tag 时触发完整发布流程
jobs:
  lint:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/xcyxiner/dicomviewer-ci:latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Python and pip
      run: |
        apt-get update && apt-get install -y python3 python3-pip

    - name: Install codespell
      run: pip3 install --break-system-packages codespell 

    - name: Lint
      run: cmake -D FORMAT_COMMAND=clang-format-18 -P cmake/lint.cmake

    - name: Spell check
      if: always()
      run: cmake -P cmake/spell.cmake

  coverage:
    needs: [lint]

    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/xcyxiner/dicomviewer-ci:latest
    # To enable coverage, delete the last line from the conditional below and
    # edit the "<name>" placeholder to your GitHub name.
    # If you do not wish to use codecov, then simply delete this job from the
    # workflow.
    if: github.repository_owner == 'xcyxiner'
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    steps:
    - uses: actions/checkout@v4

    - name: Install LCov
      run: sudo apt-get update -q
        && sudo apt-get install lcov -q -y

    - name: Configure
      run: cmake --preset=ci-coverage

    - name: Build
      run: cmake --build build/coverage -j 2

    - name: Test
      working-directory: build/coverage
      run: ctest --output-on-failure --no-tests=error -j 2

    - name: Process coverage info
      run: cmake --build build/coverage -t coverage

    - name: Submit to codecov.io
      if: env.CODECOV_TOKEN != ''
      uses: codecov/codecov-action@v4
      with:
        file: build/coverage/coverage.info
        token: ${{ secrets.CODECOV_TOKEN }}

  sanitize:
    needs: [lint]

    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/xcyxiner/dicomviewer-ci:latest

    steps:
    - uses: actions/checkout@v4

    - name: Configure
      run: cmake --preset=ci-sanitize

    - name: Build
      run: cmake --build build/sanitize -j 2

    - name: Test
      working-directory: build/sanitize
      env:
        ASAN_OPTIONS: "strict_string_checks=1:\
          detect_stack_use_after_return=1:\
          check_initialization_order=1:\
          strict_init_order=1:\
          detect_leaks=1:\
          halt_on_error=1"
        UBSAN_OPTIONS: "print_stacktrace=1:\
          halt_on_error=1"
      run: ctest --output-on-failure --no-tests=error -j 2

  test:
    needs: [lint]

    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]

    runs-on: ${{ matrix.os }}
    container:
      ${{ matrix.os == 'ubuntu-24.04' && 'ghcr.io/xcyxiner/dicomviewer-ci:latest' || null }}
    steps:
    - uses: actions/checkout@v4

    - name: Setup CMake (Windows)
      if: matrix.os == 'windows-2022'
      uses: lukka/get-cmake@latest

    - name: Setup vcpkg (Windows)
      if: matrix.os == 'windows-2022'
      shell: pwsh
      run: |
        git clone https://github.com/Microsoft/vcpkg.git C:\vcpkg
        C:\vcpkg\bootstrap-vcpkg.bat
        Add-Content -Path $env:GITHUB_ENV -Value "VCPKG_ROOT=C:\vcpkg"
        Add-Content -Path $env:GITHUB_ENV -Value "CMAKE_TOOLCHAIN_FILE=C:\vcpkg\scripts\buildsystems\vcpkg.cmake"
        Add-Content -Path $env:GITHUB_PATH -Value "C:\vcpkg"
        Add-Content -Path $env:GITHUB_ENV -Value "VCPKG_OVERLAY_TRIPLETS=${env:GITHUB_WORKSPACE}/triplets"
        Add-Content -Path $env:GITHUB_ENV -Value "VCPKG_TARGET_TRIPLET=x64-windows-release"
        Add-Content -Path $env:GITHUB_ENV -Value "VCPKG_DEFAULT_HOST_TRIPLET=x64-windows-release"
        $destDir = "C:\vcpkg\downloads"
        New-Item -ItemType Directory -Force -Path $destDir | Out-Null
        $sourceDir = Join-Path $env:GITHUB_WORKSPACE "vcpkg-cache/downloads"
        $filesToCopy = @(
            "k202009-libaec-v1.1.6.tar.gz",
            "libuuid-1.0.3.tar.gz"
        )
        foreach ($fileName in $filesToCopy) {
            $sourceFile = Join-Path $sourceDir $fileName
            if (Test-Path $sourceFile) {
                Copy-Item $sourceFile -Destination $destDir
                Write-Host "✅ Copied $fileName"
            } else {
                Write-Host "⚠️ Warning: $fileName not found in cache, will be downloaded."
            }
        }

    - name: Install static analyzers
      if: matrix.os == 'ubuntu-24.04'
      run: >-
        sudo apt-get install clang-tidy-18 cppcheck -y -q

        sudo update-alternatives --install
        /usr/bin/clang-tidy clang-tidy
        /usr/bin/clang-tidy-18 180

    - name: Setup MultiToolTask
      if: matrix.os == 'windows-2022'
      run: |
        Add-Content "$env:GITHUB_ENV" 'UseMultiToolTask=true'
        Add-Content "$env:GITHUB_ENV" 'EnforceProcessCountAcrossBuilds=true'

    - name: Configure
      if: matrix.os == 'ubuntu-24.04'
      shell: bash
      run: |
        os="${{ matrix.os }}"
        preset="ci-$(echo "$os" | cut -d'-' -f1)"
        cmake --preset="$preset"
      
    - name: Configure
      if: matrix.os == 'windows-2022'
      shell: pwsh
      run: cmake "--preset=ci-windows"

    - name: Build
      run: cmake --build build --config Release -j 2

    - name: Install
      run: cmake --install build --config Release --prefix prefix

    - name: Test
      working-directory: build
      run: ctest --output-on-failure --no-tests=error -C Release -j 2
  package:
    needs: [test]
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    container:
      ${{ matrix.os == 'ubuntu-24.04' && 'ghcr.io/xcyxiner/dicomviewer-ci:latest' || null }}

    steps:
    - uses: actions/checkout@v4

    # ---- Windows 准备 vcpkg + Qt ----
    - name: Setup vcpkg (Windows)
      if: matrix.os == 'windows-2022'
      shell: pwsh
      run: |
        git clone https://github.com/Microsoft/vcpkg.git
        .\vcpkg\bootstrap-vcpkg.bat
        Add-Content -Path $env:GITHUB_ENV -Value "VCPKG_ROOT=$pwd\vcpkg"
        Add-Content -Path $env:GITHUB_ENV -Value "CMAKE_TOOLCHAIN_FILE=$pwd\vcpkg\scripts\buildsystems\vcpkg.cmake"
        Add-Content -Path $env:GITHUB_ENV -Value "VCPKG_MAX_CONCURRENCY=1"
        Add-Content -Path $env:GITHUB_PATH -Value "$pwd\vcpkg"

    # ---- 配置 + 构建 + 安装 ----
    - name: Configure
      if: matrix.os == 'ubuntu-24.04'
      shell: bash
      run: |
        os="${{ matrix.os }}"
        preset="ci-$(echo "$os" | cut -d'-' -f1)"
        cmake --preset="$preset"
      
    - name: Configure
      if: matrix.os == 'windows-2022'
      shell: pwsh
      run: cmake "--preset=ci-$("${{ matrix.os }}".split("-")[0])"

    - name: Build
      run: cmake --build build --config Release -j 2

    - name: Install
      run: cmake --install build --config Release --prefix prefix

    # ---- Windows: 用 windeployqt 收集 Qt 依赖 ----
    - name: Deploy Qt (Windows)
      if: matrix.os == 'windows-2022'
      shell: pwsh
      run: |
        # 找到 windeployqt.exe
        $windeployqt = Get-ChildItem -Path $env:VCPKG_ROOT\installed\x64-windows-release\tools\qt6\bin -Filter windeployqt.exe -Recurse | Select-Object -First 1
        & $windeployqt.FullName --release --no-translations --qmldir ${{ github.workspace }} .\prefix\bin\*.exe
        
        # 手动补齐 vcpkg 里 Qt 依赖的第三方 DLL（windeployqt 可能漏掉）
        $extraDlls = @("double-conversion.dll","pcre2-16.dll","libpng16.dll","harfbuzz.dll","freetype.dll","brotlidec.dll","bz2.dll","brotlicommon.dll")
        foreach ($dll in $extraDlls) {
          $src = Get-ChildItem -Path $env:VCPKG_ROOT\installed\x64-windows-release\bin -Filter $dll -Recurse | Select-Object -First 1
          if ($src) { Copy-Item $src.FullName -Destination .\prefix\bin\ }
        }

    # ---- 打包 ----
    - name: Package (Windows)
      if: matrix.os == 'windows-2022'
      shell: pwsh
      run: |
        Compress-Archive -Path .\prefix\* -DestinationPath DicomViewer-windows-x64.zip

    - name: Package (Linux)
      if: matrix.os == 'ubuntu-24.04'
      run: |
        cd prefix
        tar -czvf ../DicomViewer-linux-x64.tar.gz .

    # ---- 上传为 artifact（方便调试和跨 job 传递）----
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: DicomViewer-${{ matrix.os }}
        path: |
          DicomViewer-windows-x64.zip
          DicomViewer-linux-x64.tar.gz
        if-no-files-found: ignore
  release:
    needs: [package]
    # if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # 创建 Release 必需

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
        merge-multiple: true

    - name: Create Release and upload assets
      uses: softprops/action-gh-release@v1
      with:
        files: |
          artifacts/DicomViewer-windows-x64.zip
          artifacts/DicomViewer-linux-x64.tar.gz
        draft: false
        prerelease: false
        generate_release_notes: true
  docs:
    # Deploy docs only when builds succeed
    needs: [sanitize, test]

    runs-on: ubuntu-24.04

    # To enable, first you have to create an orphaned gh-pages branch:
    #
    #    git switch --orphan gh-pages
    #    git commit --allow-empty -m "Initial commit"
    #    git push -u origin gh-pages
    #
    # Edit the <name> placeholder below to your GitHub name, so this action
    # runs only in your repository and no one else's fork. After these, delete
    # this comment and the last line in the conditional below.
    # If you do not wish to use GitHub Pages for deploying documentation, then
    # simply delete this job similarly to the coverage one.
    if: github.ref == 'refs/heads/master'
      && github.event_name == 'push'
      && github.repository_owner == '<name>'
      && false

    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with: { python-version: "3.12" }

    - name: Install m.css dependencies
      run: pip3 install jinja2 Pygments

    - name: Install Doxygen
      run: sudo apt-get update -q
        && sudo apt-get install doxygen -q -y

    - name: Build docs
      run: cmake "-DPROJECT_SOURCE_DIR=$PWD" "-DPROJECT_BINARY_DIR=$PWD/build"
        -P cmake/docs-ci.cmake

    - name: Deploy docs
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: build/docs/html
